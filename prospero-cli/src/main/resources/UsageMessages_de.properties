#
# This file contains strings that appear in generated usage messages.
#

#
# Prospero Shell Script Name
#
# This item is here to make it available to the Java runtime via a resource bundle.
prospero.dist.name=${prospero.dist.name}

#
# General Usage Sections Headings
#

usage.synopsisHeading = %nVerwendung:\u0020
# for the main command do not prepend with new line character:
${prospero.dist.name}.usage.synopsisHeading = Verwendung:\u0020
usage.commandListHeading = %nBefehle:%n
usage.optionListHeading = %nOptionen:%n

#
# Command Descriptions
#
${prospero.dist.name}.usage.customSynopsis=             @|bold ${prospero.dist.name}|@ [@|fg(yellow) -hv|@] [COMMAND]

${prospero.dist.name}.install.usage.header = Installiert eine neue Instanz des Anwendungsservers.
${prospero.dist.name}.install.usage.customSynopsis.0 =             @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.1 =   oder:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --manifest|@=@|italic <URL/GAV/path>|@ @|fg(yellow) --repositories|@=@|italic <URL>[,...]|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.2 =          (zur Installation eines Installationsprofils)
${prospero.dist.name}.install.usage.customSynopsis.3 =   oder:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --fpl|@=@|italic <GA>|@ @|fg(yellow) --channel|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.4 =          (zur Installation eines Feature Packs)
${prospero.dist.name}.install.usage.customSynopsis.5 =   oder:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --definition|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.6 =          (zur Installation von einer '@|bold provisioning.xml|@'-Galleon-Datei)
${prospero.dist.name}.install.usage.customSynopsis.7 =   oder:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --list-profiles|@
${prospero.dist.name}.install.usage.customSynopsis.8 =          (zur Auflistung verf\u00FCgbarer Installationsprofile)


${prospero.dist.name}.update.usage.header  = Aktualisiert eine Serverinstanz mit den neuesten Patches.
${prospero.dist.name}.update.usage.description.0 = Die Aktualisierungsoperation kann entweder in einem Schritt (@|bold perform|@) oder in zwei Schritten (@|bold prepare|@+@|bold apply|@) durchgef\u00FChrt werden.
${prospero.dist.name}.update.usage.description.1 = Die Operation @|bold prepare|@ erm\u00F6glicht es, einen Kandidatenserver mit den neuesten Updates zu erstellen, w\u00E4hrend die Operation @|bold apply|@ die \u00C4nderungen des Kandidatenservers auf den Basisserver \u00FCbertr\u00E4gt. Die Operation @|bold prepare|@ kann auch w\u00E4hrend der Ausf\u00FChrung des Servers abgeschlossen werden.
${prospero.dist.name}.update.usage.description.2 = Die Operation @|bold perform|@ aktualisiert direkt den Basisserver mit den neuesten Versionen. Der aktualisierte Server muss w\u00E4hrend des gesamten Vorgangs offline sein.

${prospero.dist.name}.update.perform.usage.header  = Wendet die neuesten verf\u00FCgbaren Updates direkt auf die Serverinstanz an.
${prospero.dist.name}.update.perform.usage.customSynopsis.0 = @|bold ${prospero.dist.name} update perform|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) [OPTION]|@...
${prospero.dist.name}.update.perform.usage.customSynopsis.1 =          (zur Aktualisierung einer Serverinstallation)
${prospero.dist.name}.update.perform.usage.customSynopsis.2 =   oder: @|bold ${prospero.dist.name} update perform|@ @|fg(yellow) --self|@ [@|fg(yellow) --dir|@=@|italic <path>|@] [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.update.perform.usage.customSynopsis.3 =          (zur Aktualisierung von ${prospero.dist.name})

${prospero.dist.name}.update.prepare.usage.header  = Stellt einen Serverkandidaten mit den neuesten verf\u00FCgbaren Patches bereit.
${prospero.dist.name}.update.prepare.usage.customSynopsis.0 =   @|bold ${prospero.dist.name} update prepare|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) --candidate-dir|@=@|italic <path>|@ @|fg(yellow) [OPTION]|@...

${prospero.dist.name}.update.apply.usage.header  = Wendet die Updates von einem Serverkandidaten auf die Basisserverinstanz an.

${prospero.dist.name}.update.list.usage.header  = Listet alle verf\u00FCgbaren Komponentenupdates auf.

${prospero.dist.name}.update.subscribe.usage.header  = Abonniert die Installation, um Updates zu erhalten.

${prospero.dist.name}.history.usage.header = Listet alle bisherigen Installationszust\u00E4nde auf.
${prospero.dist.name}.history.usage.description.0 = Bei @|bold --revision|@ werden \u00C4nderungen in diesem Zustand angezeigt.

${prospero.dist.name}.revert.usage.header  = Setzt den Server auf einen fr\u00FCheren Installationszustand zur\u00FCck.
${prospero.dist.name}.revert.usage.description.0 = Die Operation des Zur\u00FCcksetzens kann entweder in einem Schritt (@|bold perform|@) oder in zwei Schritten (@|bold prepare|@+@|bold apply|@) erfolgen.%n
${prospero.dist.name}.revert.usage.description.1 = Die Operation @|bold prepare|@ erm\u00F6glicht es, einen Kandidatenserver zu erstellen, der auf den gew\u00FCnschten Installationszustand zur\u00FCckgesetzt wird, w\u00E4hrend die Operation @|bold apply|@ die \u00C4nderungen des Kandidatenservers auf den Basisserver \u00FCbertr\u00E4gt. Die Operation @|bold prepare|@ kann auch w\u00E4hrend der Ausf\u00FChrung des Servers abgeschlossen werden.
${prospero.dist.name}.revert.usage.description.2 = Mit der Operation @|bold perform|@ wir der Basisserver direkt auf den gew\u00FCnschten vorherigen Installationszustand zur\u00FCckgesetzt. Der Basisserver muss w\u00E4hrend des gesamten Vorgangs offline sein.
${prospero.dist.name}.revert.prepare.usage.header = Sorgt daf\u00FCr, dass ein Kandidatenserver am angegebenen Ort in den angeforderten Zustand zur\u00FCckversetzt wird.
${prospero.dist.name}.revert.prepare.candidate-dir = Pfad, in dem der zur\u00FCckgesetzte Serverkandidat erzeugt wird. Der urspr\u00FCngliche Server wird nicht ge\u00E4ndert.
${prospero.dist.name}.revert.apply.usage.header = Wendet die Updates vom Kandidatenserver auf die Basisserverinstallation an.
${prospero.dist.name}.revert.perform.usage.header.0 = Setzt den Basisserver direkt auf den angegebenen vorherigen Installationszustand zur\u00FCck.
${prospero.dist.name}.revert.perform.usage.header.1 = Es erfolgt ein vollst\u00E4ndiges Zur\u00FCcksetzen durch Ausf\u00FChrung der beiden Schritte @|bold prepare|@ und @|bold apply|@.

${prospero.dist.name}.channel.usage.header = Verwaltet die Kan\u00E4le, die der Server verwendet, um die neuesten Updates zu erhalten.
${prospero.dist.name}.channel.add.usage.header = Abonniert die Installation f\u00FCr einen neuen Kanal.
${prospero.dist.name}.channel.add.channel.0 = Pfad zu einer YAML-Datei, die die Definition des neuen Kanals enth\u00E4lt.
${prospero.dist.name}.channel.add.channel.1 = Alternative zu '--manifest' und '--repositories'.
${prospero.dist.name}.channel.add.manifest.0 = Speicherort der Manifestdatei f\u00FCr den neuen Kanal.
${prospero.dist.name}.channel.add.manifest.1 = Geben Sie den Speicherort als Dateipfad, URL oder Maven-Koordinate (groupId:artifactId) an.
${prospero.dist.name}.channel.add.repositories.0 =  Maven-Remote-Repositorys, die die f\u00FCr die Installation des Anwendungsservers erforderlichen Artefakte enthalten.
${prospero.dist.name}.channel.add.repositories.1 = Geben Sie mehrere durch Komma getrennte Repositorys an. Geben Sie den Speicherort der Repositorys als URLs oder ID::URL-Paare an.
${prospero.dist.name}.channel.list.usage.header   = Listet die Kan\u00E4le auf, \u00FCber die die Installation Updates erh\u00E4lt.
${prospero.dist.name}.channel.remove.usage.header = Hebt das Abonnement der Installation f\u00FCr einen Kanal auf.
${prospero.dist.name}.channel.initialize.usage.header = Benutzerdefinierten Kanal hinzuf\u00FCgen, der vom Server verwendet werden soll
${prospero.dist.name}.channel.promote.usage.header = Paket von Artefakten zu einem benutzerdefinierten Repository hochstufen
${prospero.dist.name}.channel.versions.usage.header = Zeigt aktuell verwendete Versionen von Manifesten aus registrierten Kan\u00E4len an.

${prospero.dist.name}.clone.usage.header = Exportiert die f\u00FCr die Neuerstellung eines Servers erforderlichen Installationsdetails.
${prospero.dist.name}.clone.export.usage.header = Exportiert die Installationsdetails, die f\u00FCr die Neuerstellung eines Servers verwendet werden k\u00F6nnen.
${prospero.dist.name}.clone.recreate.usage.header = Erstellt einen Server anhand der Installationsdetails neu.

${prospero.dist.name}.completion.usage.header = Erzeugt ein Bash-Vervollst\u00E4ndigungsskript. Um die automatische Vervollst\u00E4ndigung zu aktivieren, verwenden Sie den Befehl 'source <(${prospero.dist.name} completion)'.
${prospero.dist.name}.completion.usage.description.0 = Wenn Sie nach der Ausf\u00FChrung des folgenden Befehls einen Teil eines Befehls eingeben und die Tabulatortaste dr\u00FCcken, wird die Befehlsfolge automatisch vervollst\u00E4ndigt.
${prospero.dist.name}.completion.usage.description.1 =
${prospero.dist.name}.completion.usage.description.2 =    source <(${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME})
${prospero.dist.name}.completion.usage.description.3 =
${prospero.dist.name}.completion.usage.description.4 = Alternativ k\u00F6nnen Sie das Vervollst\u00E4ndigungsskript auch in einer Datei speichern und diese Datei
${prospero.dist.name}.completion.usage.description.5 = aus Ihrem .bashrc-Skript auswerten:
${prospero.dist.name}.completion.usage.description.6 =
${prospero.dist.name}.completion.usage.description.7 =    ${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME} > ~/${prospero.dist.name}_completion
${prospero.dist.name}.completion.usage.description.8 =    echo ". ~/${prospero.dist.name}_completion" >> ~/.bashrc
${prospero.dist.name}.completion.usage.description.9 =

${prospero.dist.name}.apply-update.usage.header = \u00DCbertr\u00E4gt das zuvor vorbereitete Update auf den Server. Der Server muss w\u00E4hrend dieses Vorgangs angehalten werden.

${prospero.dist.name}.print-licenses.usage.header = Druckt die f\u00FCr die Installation des Servers erforderlichen Lizenzen und Zusatzvereinbarungen aus.

${prospero.dist.name}.feature-pack.add.fpl = Maven-Koordinaten eines Galleon Feature Packs, das dem Server hinzugef\u00FCgt werden soll. Die Koordinate sollte aus <groupId>:<artifactId> bestehen.
${prospero.dist.name}.feature-pack.usage.header = Verwaltet die auf dem Server installierten Feature Packs.
${prospero.dist.name}.feature-pack.add.usage.header = Installiert ein neues Feature Pack auf dem Server.
${prospero.dist.name}.feature-pack.add.layers = Zur Installation ausgew\u00E4hlte Feature Pack-Layer. Geben Sie mehrere Layer durch Kommas getrennt an.
${prospero.dist.name}.feature-pack.add.target-config = Serverkonfigurationsdatei, auf die die Feature Pack-\u00C4nderungen angewendet werden. Bei keiner Angabe wird standardm\u00E4\u00DFig @|bold standalone.xml|@ verwendet.


