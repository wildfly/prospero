config-stability-level.1 = Las opciones v\u00E1lidas son${COMPLETION-CANDIDATES}.
package-stability-level.0 = Seleccione la estabilidad m\u00EDnima de los paquetes aprovisionados (por ejemplo, m\u00F3dulos JBoss) en el servidor. No se puede usar junto con @|bold --stability-level|@.
package-stability-level.1 = Las opciones v\u00E1lidas son${COMPLETION-CANDIDATES}.

