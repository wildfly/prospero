verbose = Imprime informaci\u00F3n adicional si falla el comando.
${prospero.dist.name}.verbose = Imprime informaci\u00F3n adicional si falla el comando.
debug = Imprime mensajes de depuraci\u00F3n.
${prospero.dist.name}.debug = Imprime mensajes de depuraci\u00F3n.
local-cache = Ruta a la cach\u00E9 del repositorio local de Maven. Anula el repositorio predeterminado de Maven en ~/.m2/repository.
