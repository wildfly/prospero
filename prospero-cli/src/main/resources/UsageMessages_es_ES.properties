#
# This file contains strings that appear in generated usage messages.
#

#
# Prospero Shell Script Name
#
# This item is here to make it available to the Java runtime via a resource bundle.
prospero.dist.name=${prospero.dist.name}

#
# General Usage Sections Headings
#

usage.synopsisHeading = %nUso:\u0020
# for the main command do not prepend with new line character:
${prospero.dist.name}.usage.synopsisHeading = Uso:\u0020
usage.commandListHeading = %nComandos:%n
usage.optionListHeading = %nOpciones:%n

#
# Command Descriptions
#
${prospero.dist.name}.usage.customSynopsis=             @|bold ${prospero.dist.name}|@ [@|fg(yellow) -hv|@] [COMMAND]

${prospero.dist.name}.install.usage.header = Instala una nueva instancia del servidor de aplicaciones.
${prospero.dist.name}.install.usage.customSynopsis.0 =             @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.1 =   o: @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --manifest|@=@|italic <URL/GAV/path>|@ @|fg(yellow) --repositories|@=@|italic <URL>[,...]|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.2 =          (para instalar un perfil de instalaci\u00F3n)
${prospero.dist.name}.install.usage.customSynopsis.3 =   o: @|bold ${prospero.dist.name} install|@ @|fg(yellow) --fpl|@=@|italic <GA>|@ @|fg(yellow) --channel|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.4 =          (para instalar un paquete de funciones)
${prospero.dist.name}.install.usage.customSynopsis.5 =   o: @|bold ${prospero.dist.name} install|@ @|fg(yellow) --definition|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.6 =          (para instalar desde un archivo Galleon \u201C@|bold provisioning.xml|@\u201D)
${prospero.dist.name}.install.usage.customSynopsis.7 =   o: @|bold ${prospero.dist.name} install|@ @|fg(yellow) --list-profiles|@
${prospero.dist.name}.install.usage.customSynopsis.8 =          (para enumerar los perfiles de instalaci\u00F3n disponibles)


${prospero.dist.name}.update.usage.header  = Actualiza una instancia de servidor con los \u00FAltimos parches.
${prospero.dist.name}.update.usage.description.0 = La operaci\u00F3n de actualizaci\u00F3n se puede ejecutar como una operaci\u00F3n de un paso (@|bold perform|@) o de dos pasos (@|bold prepare|@+@|bold apply|@).
${prospero.dist.name}.update.usage.description.1 = La operaci\u00F3n @|bold prepare|@ permite crear un servidor candidato con las \u00FAltimas actualizaciones, mientras que la operaci\u00F3n @|bold apply|@ aplica los cambios del servidor candidato al servidor base. La operaci\u00F3n @|bold prepare|@ puede completarse incluso con el servidor en ejecuci\u00F3n.
${prospero.dist.name}.update.usage.description.2 = La operaci\u00F3n @|bold perform|@ actualiza directamente el servidor base con las \u00FAltimas versiones. El servidor actualizado debe estar desconectado durante toda la operaci\u00F3n.

${prospero.dist.name}.update.perform.usage.header  = Aplica las \u00FAltimas actualizaciones disponibles directamente en la instancia del servidor.
${prospero.dist.name}.update.perform.usage.customSynopsis.0 = @|bold ${prospero.dist.name} update perform|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) [OPTION]|@...
${prospero.dist.name}.update.perform.usage.customSynopsis.1 =          (para actualizar una instalaci\u00F3n del servidor)
${prospero.dist.name}.update.perform.usage.customSynopsis.2 =   o: @|bold ${prospero.dist.name} update perform|@ @|fg(yellow) --self|@ [@|fg(yellow) --dir|@=@|italic <path>|@] [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.update.perform.usage.customSynopsis.3 =          (para actualizar ${prospero.dist.name})

${prospero.dist.name}.update.prepare.usage.header  = Proporciona a un servidor candidato los \u00FAltimos parches disponibles.
${prospero.dist.name}.update.prepare.usage.customSynopsis.0 =   @|bold ${prospero.dist.name} update prepare|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) --candidate-dir|@=@|italic <path>|@ @|fg(yellow) [OPTION]|@...

${prospero.dist.name}.update.apply.usage.header  = Aplica las actualizaciones de un servidor candidato a la instancia del servidor base.

${prospero.dist.name}.update.list.usage.header  = Enumera todas las actualizaciones de componentes disponibles.

${prospero.dist.name}.update.subscribe.usage.header  = Suscribe la instalaci\u00F3n para recibir actualizaciones.

${prospero.dist.name}.history.usage.header = Enumera todos los estados de instalaci\u00F3n anteriores.
${prospero.dist.name}.history.usage.description.0 = Si se proporciona @|bold --revision|@, se muestran los cambios en ese estado.

${prospero.dist.name}.revert.usage.header  = Revierte el servidor a un estado de instalaci\u00F3n anterior.
${prospero.dist.name}.revert.usage.description.0 = La operaci\u00F3n de reversi\u00F3n puede ejecutarse como una operaci\u00F3n de un paso (@|bold perform|@) o de dos pasos (@|bold prepare|@+@|bold apply|@).%n
${prospero.dist.name}.revert.usage.description.1 = La operaci\u00F3n @|bold prepare|@ permite crear un servidor candidato que se revierte al estado de instalaci\u00F3n solicitado, mientras que la operaci\u00F3n @|bold apply|@ aplica los cambios del servidor candidato al servidor base. La operaci\u00F3n @|bold prepare|@ puede completarse incluso con el servidor en ejecuci\u00F3n.
${prospero.dist.name}.revert.usage.description.2 = La operaci\u00F3n @|bold perform|@ revierte directamente el servidor base al estado de instalaci\u00F3n previo solicitado. El servidor base debe estar desconectado durante toda la operaci\u00F3n.
${prospero.dist.name}.revert.prepare.usage.header = Aprovisiona un servidor candidato revertido al estado solicitado en la ubicaci\u00F3n especificada.
${prospero.dist.name}.revert.prepare.candidate-dir = Ruta para generar el servidor candidato revertido. El servidor original no se modificar\u00E1.
${prospero.dist.name}.revert.apply.usage.header = Aplica las actualizaciones del servidor candidato a la instalaci\u00F3n del servidor base.
${prospero.dist.name}.revert.perform.usage.header.0 = Revierte el servidor base directamente al estado de instalaci\u00F3n anterior especificado.
${prospero.dist.name}.revert.perform.usage.header.1 = Realiza la operaci\u00F3n de reversi\u00F3n completa mediante la ejecuci\u00F3n de los pasos @|bold prepare|@ y @|bold apply|@.

${prospero.dist.name}.channel.usage.header = Administra los canales utilizados por el servidor para obtener las \u00FAltimas actualizaciones.
${prospero.dist.name}.channel.add.usage.header = Suscribe la instalaci\u00F3n a un nuevo canal.
${prospero.dist.name}.channel.add.channel.0 = Ruta a un archivo YAML que contiene la definici\u00F3n del nuevo canal.
${prospero.dist.name}.channel.add.channel.1 = Alternativa a --manifest y --repositories.
${prospero.dist.name}.channel.add.manifest.0 = Ubicaci\u00F3n del archivo de manifiesto para el nuevo canal.
${prospero.dist.name}.channel.add.manifest.1 = Especifique la ubicaci\u00F3n como una ruta de archivo, URL o coordenada de Maven (groupId:artifactId).
${prospero.dist.name}.channel.add.repositories.0 =  Repositorios remotos de Maven que contienen los artefactos necesarios para instalar el servidor de aplicaciones.
${prospero.dist.name}.channel.add.repositories.1 = Especifique varios repositorios separados por coma. Indique la ubicaci\u00F3n de los repositorios como URL o pares ID::URL.
${prospero.dist.name}.channel.list.usage.header   = Enumera los canales utilizados por la instalaci\u00F3n para obtener actualizaciones
${prospero.dist.name}.channel.remove.usage.header = Cancela la suscripci\u00F3n a la instalaci\u00F3n de un canal.
${prospero.dist.name}.channel.initialize.usage.header = Agrega un canal personalizado para que lo use el servidor
${prospero.dist.name}.channel.promote.usage.header = Promociona un paquete de artefactos a un repositorio personalizado
${prospero.dist.name}.channel.versions.usage.header = Muestra las versiones utilizadas actualmente de los manifiestos de los canales registrados.

${prospero.dist.name}.clone.usage.header = Exporta los detalles de instalaci\u00F3n necesarios para recrear un servidor.
${prospero.dist.name}.clone.export.usage.header = Exporta los detalles de instalaci\u00F3n que pueden usarse para recrear un servidor.
${prospero.dist.name}.clone.recreate.usage.header = Recrea un servidor a partir de los detalles de instalaci\u00F3n.

${prospero.dist.name}.completion.usage.header = Genera un script de autocompletado de bash. Para habilitarlo, use el comando \u201Csource <(${prospero.dist.name} completion)\u201D.
${prospero.dist.name}.completion.usage.description.0 = Despu\u00E9s de ejecutar el siguiente comando, si escribe parcialmente un comando y presiona la tecla Tab, la secuencia de comandos se completar\u00E1 de forma autom\u00E1tica.
${prospero.dist.name}.completion.usage.description.1 =
${prospero.dist.name}.completion.usage.description.2 =    source <(${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME})
${prospero.dist.name}.completion.usage.description.3 =
${prospero.dist.name}.completion.usage.description.4 = Como alternativa, tambi\u00E9n puede guardar el script de finalizaci\u00F3n en un archivo y evaluar dicho archivo
${prospero.dist.name}.completion.usage.description.5 = desde su script .bashrc:
${prospero.dist.name}.completion.usage.description.6 =
${prospero.dist.name}.completion.usage.description.7 =    ${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME} > ~/${prospero.dist.name}_completion
${prospero.dist.name}.completion.usage.description.8 =    echo ". ~/${prospero.dist.name}_completion" >> ~/.bashrc
${prospero.dist.name}.completion.usage.description.9 =

${prospero.dist.name}.apply-update.usage.header = Aplique la actualizaci\u00F3n previamente preparada al servidor. El servidor debe estar detenido durante esta operaci\u00F3n.

${prospero.dist.name}.print-licenses.usage.header = Imprime licencias y acuerdos adicionales necesarios para instalar el servidor.

${prospero.dist.name}.feature-pack.add.fpl = Coordenadas Maven de un paquete de funciones de Galleon para agregar al servidor. La coordenada debe incluir <groupId>:<artifactId>.
${prospero.dist.name}.feature-pack.usage.header = Administra los paquetes de funciones instalados en el servidor.
${prospero.dist.name}.feature-pack.add.usage.header = Instala un nuevo paquete de funciones en el servidor.
${prospero.dist.name}.feature-pack.add.layers = Capas del paquete de funciones seleccionadas para su instalaci\u00F3n. Especifique varias capas separadas por comas.
${prospero.dist.name}.feature-pack.add.target-config = Archivo de configuraci\u00F3n del servidor al que se aplicar\u00E1n los cambios del paquete de funciones. Si no se especifica, el valor predeterminado es @|bold standalone.xml|@.


