use-default-local-cache = Habilite el almacenamiento en cach\u00E9 y la resoluci\u00F3n de artefactos desde la cach\u00E9 de Maven local predeterminada.
offline = Realice la instalaci\u00F3n del servidor \u00FAnicamente desde la cach\u00E9 local o desde repositorios Maven del sistema de archivos.
