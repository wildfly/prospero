${prospero.dist.name}.feature-pack.add.target-config = Fichier de configuration du serveur auquel les modifications du Feature Pack seront appliqu\u00E9es. Si non sp\u00E9cifi\u00E9, la valeur par d\u00E9faut est @|bold standalone.xml|@.


