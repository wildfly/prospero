${prospero.dist.name}.channel.versions.usage.header = Affiche les versions actuellement utilis\u00E9es des manifestes des canaux enregistr\u00E9s.

${prospero.dist.name}.clone.usage.header = Exporte les d\u00E9tails de l'installation n\u00E9cessaires pour recr\u00E9er un serveur.
${prospero.dist.name}.clone.export.usage.header = Exporte les d\u00E9tails de l'installation qui peuvent \u00EAtre utilis\u00E9s pour recr\u00E9er un serveur.
${prospero.dist.name}.clone.recreate.usage.header = Recr\u00E9e un serveur \u00E0 partir des d\u00E9tails de l'installation.

${prospero.dist.name}.completion.usage.header = G\u00E9n\u00E8re un script de compl\u00E9tion bash. Pour activer l'auto-compl\u00E9tion, utilisez la commande `source <(${prospero.dist.name} completion)`.
${prospero.dist.name}.completion.usage.description.0 = Apr\u00E8s avoir ex\u00E9cut\u00E9 la commande suivante, si vous tapez partiellement une commande et que vous appuyez sur la touche Tab, la s\u00E9quence de commandes est automatiquement termin\u00E9e.
${prospero.dist.name}.completion.usage.description.1 =
${prospero.dist.name}.completion.usage.description.2 =    source <(${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME})
${prospero.dist.name}.completion.usage.description.3 =
${prospero.dist.name}.completion.usage.description.4 = Vous pouvez \u00E9galement enregistrer le script d'ach\u00E8vement dans un fichier et \u00E9valuer ce fichier
${prospero.dist.name}.completion.usage.description.5 = dans votre script .bashrc :
${prospero.dist.name}.completion.usage.description.6 =
${prospero.dist.name}.completion.usage.description.7 =    ${PARENT-COMMAND-FULL-NAME:-$PARENTCOMMAND} ${COMMAND-NAME} > ~/${prospero.dist.name}_completion
${prospero.dist.name}.completion.usage.description.8 =    echo ". ~/${prospero.dist.name}_completion" >> ~/.bashrc
${prospero.dist.name}.completion.usage.description.9 =

${prospero.dist.name}.apply-update.usage.header = Appliquer au serveur la mise \u00E0 jour pr\u00E9par\u00E9e pr\u00E9c\u00E9demment. Le serveur doit \u00EAtre arr\u00EAt\u00E9 pendant cette op\u00E9ration.

${prospero.dist.name}.print-licenses.usage.header = Imprime les licences et les accords suppl\u00E9mentaires n\u00E9cessaires \u00E0 l'installation du serveur.

${prospero.dist.name}.feature-pack.add.fpl = Coordonn\u00E9es Maven d'un pack de fonctionnalit\u00E9s Galleon \u00E0 ajouter au serveur. Ces coordonn\u00E9es doivent \u00EAtre les suivantes\u00A0<groupId>:<artifactId>.
