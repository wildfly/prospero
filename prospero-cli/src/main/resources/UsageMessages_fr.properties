usage.optionListHeading = %nOptions :%n

#
# Command Descriptions
#
${prospero.dist.name}.usage.customSynopsis=             @|bold ${prospero.dist.name}|@ [@|fg(yellow) -hv|@] [COMMAND]

${prospero.dist.name}.install.usage.header = Installe une nouvelle instance du serveur d'application.
${prospero.dist.name}.install.usage.customSynopsis.0 =             @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.1 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --manifest|@=@|italic <URL/GAV/path>|@ @|fg(yellow) --repositories|@=@|italic <URL>[,...]|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.2 =          (pour installer un profil d'installation)
${prospero.dist.name}.install.usage.customSynopsis.3 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --fpl|@=@|italic <GA>|@ @|fg(yellow) --channel|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.4 =          (pour installer un pack de fonctionnalit\u00E9s)
${prospero.dist.name}.install.usage.customSynopsis.5 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --definition|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.6 =          (pour installer \u00E0 partir d'un fichier Galleon `@|bold provisioning.xml|@`)
${prospero.dist.name}.install.usage.customSynopsis.7 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --list-profiles|@
${prospero.dist.name}.install.usage.customSynopsis.8 =          (pour lister les profils d'installation disponibles)


${prospero.dist.name}.update.usage.header  = Met \u00E0 jour une instance de serveur avec les derniers correctifs.
${prospero.dist.name}.update.usage.description.0 = L'op\u00E9ration de mise \u00E0 jour peut \u00EAtre ex\u00E9cut\u00E9e en une \u00E9tape (@|bold perform|@) ou en deux \u00E9tapes (@|bold prepare|@+@|bold apply|@).
${prospero.dist.name}.update.usage.description.1 = L'op\u00E9ration @|bold prepare|@ permet de cr\u00E9er un serveur candidat avec les derni\u00E8res mises \u00E0 jour tandis que l'op\u00E9ration @|bold apply|@ appliquera les changements du serveur candidat au serveur de base. L'op\u00E9ration @|bold prepare|@ peut \u00EAtre effectu\u00E9e m\u00EAme si le serveur est en cours d'ex\u00E9cution.
${prospero.dist.name}.update.usage.description.2 = L'op\u00E9ration @|bold perform|@ met directement \u00E0 jour le serveur de base avec les derni\u00E8res versions. Le serveur mis \u00E0 jour doit \u00EAtre hors ligne pendant toute la dur\u00E9e de l'op\u00E9ration.

${prospero.dist.name}.update.perform.usage.header  = Applique les derni\u00E8res mises \u00E0 jour disponibles directement sur l'instance du serveur.
${prospero.dist.name}.update.perform.usage.customSynopsis.0 = @|bold ${prospero.dist.name} update perform|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) [OPTION]|@....
${prospero.dist.name}.update.perform.usage.customSynopsis.1 =          (pour mettre \u00E0 jour l'installation d'un serveur)
${prospero.dist.name}.update.perform.usage.customSynopsis.2 =   ou :  @|bold ${prospero.dist.name} update perform|@ @|fg(yellow) --self|@ [@|fg(yellow) --dir|@=@|italic <path>|@] [@|fg(yellow) OPTION|@]....
${prospero.dist.name}.update.perform.usage.customSynopsis.3 =          (pour mettre \u00E0 jour ${prospero.dist.name})

${prospero.dist.name}.update.prepare.usage.header  = Fournit un serveur candidat avec les derniers correctifs disponibles.
${prospero.dist.name}.update.prepare.usage.customSynopsis.0 =   @|bold ${prospero.dist.name} update prepare|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) --candidate-dir|@=@|italic <path>|@ @|fg(yellow) [OPTION]|@....

${prospero.dist.name}.update.apply.usage.header  = Applique les mises \u00E0 jour d'un candidat serveur \u00E0 l'instance de serveur de base.

${prospero.dist.name}.update.list.usage.header  = Liste de toutes les mises \u00E0 jour de composants disponibles.

${prospero.dist.name}.update.subscribe.usage.header  = Abonne l'installation pour recevoir les mises \u00E0 jour.

${prospero.dist.name}.history.usage.header = Liste tous les \u00E9tats d'installation pr\u00E9c\u00E9dents.
${prospero.dist.name}.history.usage.description.0 = Si le @|bold --revision|@ est fourni, il affiche les modifications dans cet \u00E9tat.

${prospero.dist.name}.revert.usage.header  = R\u00E9initialise le serveur \u00E0 un \u00E9tat d'installation ant\u00E9rieur.
${prospero.dist.name}.revert.usage.description.0 = L'op\u00E9ration d'inversion peut \u00EAtre ex\u00E9cut\u00E9e en une \u00E9tape (@|bold perform|@) ou en deux \u00E9tapes (@|bold prepare|@+@|bold apply|@).%n
${prospero.dist.name}.revert.usage.description.1 = L'op\u00E9ration @|bold prepare|@ permet de cr\u00E9er un serveur candidat qui est ramen\u00E9 \u00E0 l'\u00E9tat d'installation demand\u00E9, tandis que l'op\u00E9ration @|bold apply|@ applique les modifications du serveur candidat au serveur de base. L'op\u00E9ration @|bold prepare|@ peut \u00EAtre effectu\u00E9e m\u00EAme si le serveur est en cours d'ex\u00E9cution.
${prospero.dist.name}.revert.usage.description.2 = L'op\u00E9ration @|bold perform|@ ram\u00E8ne directement le serveur de base \u00E0 l'\u00E9tat d'installation pr\u00E9c\u00E9dent demand\u00E9. Le serveur de base doit \u00EAtre hors ligne pendant toute la dur\u00E9e de l'op\u00E9ration.
${prospero.dist.name}.revert.prepare.usage.header = Dispositions un serveur candidat est revenu \u00E0 l'\u00E9tat demand\u00E9 \u00E0 l'endroit sp\u00E9cifi\u00E9.
${prospero.dist.name}.revert.prepare.candidate-dir = Chemin d'acc\u00E8s pour g\u00E9n\u00E9rer le candidat serveur invers\u00E9. Le serveur d'origine ne sera pas modifi\u00E9.
${prospero.dist.name}.revert.apply.usage.header = Applique les mises \u00E0 jour du serveur candidat \u00E0 l'installation du serveur de base.
${prospero.dist.name}.revert.perform.usage.header.0 = R\u00E9initialise le serveur de base directement \u00E0 l'\u00E9tat d'installation pr\u00E9c\u00E9dent sp\u00E9cifi\u00E9.
${prospero.dist.name}.revert.perform.usage.header.1 = Il effectue l'op\u00E9ration compl\u00E8te de r\u00E9version en ex\u00E9cutant les \u00E9tapes @|bold prepare|@ et @|bold apply|@.

${prospero.dist.name}.channel.usage.header = G\u00E8re les canaux utilis\u00E9s par le serveur pour obtenir les derni\u00E8res mises \u00E0 jour.
${prospero.dist.name}.channel.add.usage.header = Abonne l'installation \u00E0 un nouveau canal.
${prospero.dist.name}.channel.add.channel.0 = Chemin vers un fichier YAML contenant la d\u00E9finition du nouveau canal.
