${prospero.dist.name}.channel.add.repositories.1 = Sp\u00E9cifiez plusieurs r\u00E9f\u00E9rentiels s\u00E9par\u00E9s par des virgules. Sp\u00E9cifiez l'emplacement des r\u00E9f\u00E9rentiels sous forme d'URL ou de paires ID::URL.
${prospero.dist.name}.channel.list.usage.header   = Liste des canaux utilis\u00E9s par l'installation pour obtenir des mises \u00E0 jour
