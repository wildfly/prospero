#
# Prospero Shell Script Name
#
# This item is here to make it available to the Java runtime via a resource bundle.
prospero.dist.name=${prospero.dist.name}

#
# General Usage Sections Headings
#

usage.synopsisHeading = %nUso:\u0020
# for the main command do not prepend with new line character:
${prospero.dist.name}.usage.synopsisHeading = Uso:\u0020
usage.commandListHeading = %nComandos:%n
usage.optionListHeading = %nOp\u00E7\u00F5es:%n

#
# Command Descriptions
#
${prospero.dist.name}.usage.customSynopsis=             @|bold ${prospero.dist.name}|@ [@|fg(yellow) -hv|@] [COMMAND]

${prospero.dist.name}.install.usage.header = Instala uma nova inst\u00E2ncia do servidor do aplicativo.
${prospero.dist.name}.install.usage.customSynopsis.0 =             @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.1 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --profile|@=@|italic <predefined-name>|@ @|fg(yellow) --manifest|@=@|italic <URL/GAV/path>|@ @|fg(yellow) --repositories|@=@|italic <URL>[,...]|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.2 =          (para instalar um perfil de instala\u00E7\u00E3o)
${prospero.dist.name}.install.usage.customSynopsis.3 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --fpl|@=@|italic <GA>|@ @|fg(yellow) --channel|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.4 =          (para instalar um pacote de recursos)
${prospero.dist.name}.install.usage.customSynopsis.5 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --definition|@=@|italic <path>|@ @|fg(yellow) --dir|@=@|italic <target-directory>|@ [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.install.usage.customSynopsis.6 =          (para instalar de com um arquivo Galleon `@|bold provisioning.xml|@`)
${prospero.dist.name}.install.usage.customSynopsis.7 =   ou:  @|bold ${prospero.dist.name} install|@ @|fg(yellow) --list-profiles|@
${prospero.dist.name}.install.usage.customSynopsis.8 =          (para listar os perfis de instala\u00E7\u00E3o dispon\u00EDveis)


${prospero.dist.name}.update.usage.header  = Atualiza uma inst\u00E2ncia do servidor com os patches mais recentes.
${prospero.dist.name}.update.usage.description.0 = A opera\u00E7\u00E3o de atualiza\u00E7\u00E3o pode ser executada como uma opera\u00E7\u00E3o de uma etapa (@|bold perform|@) ou duas etapas (@|bold prepare|@+@|bold apply|@).
${prospero.dist.name}.update.usage.description.1 = A opera\u00E7\u00E3o @|bold prepare|@ permite criar um servidor candidato com as \u00FAltimas atualiza\u00E7\u00F5es enquanto a opera\u00E7\u00E3o @|bold apply|@ aplicar\u00E1 as mudan\u00E7as do servidor candidato ao servidor de base. A opera\u00E7\u00E3o @|bold prepare|@ pode ser completada mesmo que o servidor esteja em execu\u00E7\u00E3o.
${prospero.dist.name}.update.usage.description.2 = A opera\u00E7\u00E3o @|bold perform|@ atualiza diretamente o servidor de base com as vers\u00F5es mais recentes. O servidor atualizado deve estar off-line para toda a opera\u00E7\u00E3o.

${prospero.dist.name}.update.perform.usage.header  = Aplica as \u00FAltimas atualiza\u00E7\u00F5es dispon\u00EDveis diretamente na inst\u00E2ncia do servidor.
${prospero.dist.name}.update.perform.usage.customSynopsis.0 = @|bold ${prospero.dist.name} update perform|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) [OPTION]|@...
${prospero.dist.name}.update.perform.usage.customSynopsis.1 =          (para atualizar a instala\u00E7\u00E3o de um servidor)
${prospero.dist.name}.update.perform.usage.customSynopsis.2 =   ou:  @|bold ${prospero.dist.name} update perform|@ @|fg(yellow) --self|@ [@|fg(yellow) --dir|@=@|italic <path>|@] [@|fg(yellow) OPTION|@]...
${prospero.dist.name}.update.perform.usage.customSynopsis.3 =          (para atualizar ${prospero.dist.name})

${prospero.dist.name}.update.prepare.usage.header  = Provis\u00F5es de um candidato a servidor com os \u00FAltimos patches dispon\u00EDveis.
${prospero.dist.name}.update.prepare.usage.customSynopsis.0 =   @|bold ${prospero.dist.name} update prepare|@ [@|fg(yellow) --dir|@=@|italic <path>|@] @|fg(yellow) --candidate-dir|@=@|italic <path>|@ @|fg(yellow) [OPTION]|@...

${prospero.dist.name}.update.apply.usage.header  = Aplica as atualiza\u00E7\u00F5es de um candidato a servidor \u00E0 inst\u00E2ncia do servidor de base.

${prospero.dist.name}.update.list.usage.header  = Liste todas as atualiza\u00E7\u00F5es de componentes dispon\u00EDveis.

${prospero.dist.name}.update.subscribe.usage.header  = Inscreve a instala\u00E7\u00E3o para receber atualiza\u00E7\u00F5es.

${prospero.dist.name}.history.usage.header = Lista todos os estados de instala\u00E7\u00E3o anteriores.
${prospero.dist.name}.history.usage.description.0 = Se @|bold --revision|@ for fornecido, ele mostrar\u00E1 as altera\u00E7\u00F5es nesse estado.

${prospero.dist.name}.revert.usage.header  = Reverte o servidor para um estado de instala\u00E7\u00E3o anterior.
${prospero.dist.name}.revert.usage.description.0 = A opera\u00E7\u00E3o de revers\u00E3o pode ser executada como uma opera\u00E7\u00E3o de uma etapa (@|bold perform|@) ou duas etapas (@|bold prepare|@+@|bold apply|@).%n
${prospero.dist.name}.revert.usage.description.1 = A opera\u00E7\u00E3o @|bold prepare|@ permite criar um servidor candidato que \u00E9 revertido para o estado de instala\u00E7\u00E3o solicitado, enquanto a opera\u00E7\u00E3o @|bold apply|@ aplicar\u00E1 as mudan\u00E7as do servidor candidato ao servidor de base. A opera\u00E7\u00E3o @|bold prepare|@ pode ser completada mesmo que o servidor esteja em execu\u00E7\u00E3o.
${prospero.dist.name}.revert.usage.description.2 = A opera\u00E7\u00E3o @|bold perform|@ reverte diretamente o servidor de base para o estado de instala\u00E7\u00E3o anterior solicitado. O servidor de base deve estar off-line durante toda a opera\u00E7\u00E3o.
${prospero.dist.name}.revert.prepare.usage.header = Provisiona um servidor candidato revertido para o estado solicitado no local especificado.
${prospero.dist.name}.revert.prepare.candidate-dir = Caminho para gerar o candidato servidor revertido. O servidor original n\u00E3o ser\u00E1 alterado.
${prospero.dist.name}.revert.apply.usage.header = Aplica as atualiza\u00E7\u00F5es do servidor candidato para a instala\u00E7\u00E3o do servidor de base.
${prospero.dist.name}.revert.perform.usage.header.0 = Reverte o servidor de base diretamente para o estado de instala\u00E7\u00E3o anterior especificado.
${prospero.dist.name}.revert.perform.usage.header.1 = Ele realiza a opera\u00E7\u00E3o completa de revers\u00E3o executando as etapas @|bold prepare|@ e @|bold apply|@.

${prospero.dist.name}.channel.usage.header = Gerencia os canais usados pelo servidor para obter as \u00FAltimas atualiza\u00E7\u00F5es.
${prospero.dist.name}.channel.add.usage.header = Subscreve a instala\u00E7\u00E3o para um novo canal.
