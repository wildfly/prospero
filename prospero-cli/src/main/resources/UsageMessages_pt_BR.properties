${prospero.dist.name}.channel.promote.usage.header = Promover um pacote de artefatos para um reposit\u00F3rio personalizado
${prospero.dist.name}.channel.versions.usage.header = Exibe vers\u00F5es atualmente usadas de manifestos de canais registrados.

${prospero.dist.name}.clone.usage.header = Exporta os detalhes de instala\u00E7\u00E3o necess\u00E1rios para recriar um servidor.
${prospero.dist.name}.clone.export.usage.header = Exporta os detalhes de instala\u00E7\u00E3o que podem ser usados para recriar um servidor.
