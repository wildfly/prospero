${prospero.dist.name}.completion.usage.description.0 = Ap\u00F3s executar o comando a seguir, se voc\u00EA digitar parcialmente um comando e pressionar a tecla Tab, a sequ\u00EAncia de comandos ser\u00E1 automaticamente completada.
