${prospero.dist.name}.channel.add.repositories.0 =  Reposit\u00F3rios Maven remotos que cont\u00EAm os artefatos necess\u00E1rios para instalar o servidor do aplicativo.
${prospero.dist.name}.channel.add.repositories.1 = Especifique reposit\u00F3rios m\u00FAltiplos separados por v\u00EDrgulas. Especifique o local dos reposit\u00F3rios como URLs ou pares ID::URL.
${prospero.dist.name}.channel.list.usage.header   = Lista os canais usados pela instala\u00E7\u00E3o para obter atualiza\u00E7\u00F5es
${prospero.dist.name}.channel.remove.usage.header = Cancela a subscri\u00E7\u00E3o da instala\u00E7\u00E3o em um canal.
